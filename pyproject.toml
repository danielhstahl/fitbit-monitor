[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-monitor"
version = "0.1.0"
description = "Local-first Fitbit monitor: import, store, and alert on your own health data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fitbit-monitor contributors" }]
keywords = ["fitbit", "health", "monitoring", "plugins"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Runtime dependencies are deliberately empty: everything here is stdlib-only so a
# fresh clone is runnable and a plugin author needs nothing but Python to start.
dependencies = []

[project.optional-dependencies]
# The whole toolchain is one extra, so the two supported install paths -
# `uv sync --extra dev` (respects uv.lock) and `pip install -e ".[dev]"` (no uv
# required) - end up with exactly what scripts/ci/*.sh calls. ADR-0001 §3, §10.
dev = ["pytest>=8", "pytest-cov>=5", "coverage[toml]>=7", "mypy>=1.10", "ruff>=0.6", "pyyaml>=6"]

# The plugin entry-point group named by ADR-0004. Third-party distributions publish
# classes into this group and `fm plugins list` finds them with no configuration.
[project.entry-points."fitbit_monitor.plugins"]
resting_trend = "fitbit_monitor.plugins.builtin.resting_trend:RestingTrendPlugin"
# The reference alerting plugin. The name is the CLI and config key (`hr-anomaly`),
# which is also what `[plugins.hr-anomaly]` in config.toml has to be spelled.
"hr-anomaly" = "fitbit_monitor.plugins.builtin.hr_anomaly:HrAnomalyPlugin"
# The nightly-HRV example: the same job as `hr-anomaly` over a series that is one value per
# night instead of one per minute, so it carries its own statistics module.
"hrv-anomaly" = "fitbit_monitor.plugins.builtin.hrv_anomaly:HrvAnomalyPlugin"

[project.scripts]
# Two names, one entrypoint (ADR-0001 §11): `fitbit-monitor` is the name that goes in
# docs, cron lines and another package's subprocess call; `fm` is what a human types.
fitbit-monitor = "fitbit_monitor.cli:main"
fm = "fitbit_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitbit_monitor = ["py.typed", "store/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fitbit_monitor"]
branch = true
# Nothing is omitted: `plugins/testing.py` is the test-support module published to
# third-party authors, and the suite they inherit is exercised here by the built-ins -
# so its coverage counts, the same way it will count in their repos.

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# Per-package coverage floors, enforced by scripts/ci/coverage.sh and by nothing else.
# `fail_under` above gates the whole tree; a floor here gates one directory under
# src/fitbit_monitor at a time, so a package cannot be quietly hollowed out by work
# that is only tested somewhere else. Keys are those directory names ("." means the
# modules at the root); an unlisted directory falls back to default_package_floor.
#
# A floor is a ratchet, not a target: each one sits about four points under what the
# tree measures today (measured with branches on, the same way the gate adds up), so
# unrelated work cannot brush past it, and it goes up in the commit that raises it.
# coverage.py ignores this table - it reads [tool.coverage.*].
[tool.fitbit_monitor.coverage]
default_package_floor = 80.0
package_floors = { "." = 87.0, api = 88.0, cli = 82.0, ingest = 87.0, plugins = 92.0, store = 92.0 }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Tier 1 of the lint policy in ADR-0001 §10: pyflakes' own rules (F) plus the
# pycodestyle subset the tree already passes. Tier 2 (I, UP, SIM, B, C4) is a
# deliberate follow-up commit, not a surprise - see the ADR for the measured cost.
select = ["E4", "E7", "E9", "W", "F"]

[tool.ruff.format]
# Chosen but not yet gated: `ruff format --check` joins scripts/ci/lint.sh in the
# single formatting-only commit named by ADR-0001 §10. The settings live here now so
# that commit contains reformatting and nothing else.

[tool.mypy]
python_version = "3.11"
files = ["src/fitbit_monitor"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
