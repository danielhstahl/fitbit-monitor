[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-monitor"
version = "0.1.0"
description = "Local-first Fitbit monitor: import, store, and alert on your own health data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fitbit-monitor contributors" }]
keywords = ["fitbit", "health", "monitoring", "plugins"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Runtime dependencies are deliberately empty: everything here is stdlib-only so a
# fresh clone is runnable and a plugin author needs nothing but Python to start.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "coverage[toml]>=7", "mypy>=1.10", "pyflakes>=3", "pyyaml>=6"]

# The plugin entry-point group named by ADR-0004. Third-party distributions publish
# classes into this group and `fm plugins list` finds them with no configuration.
[project.entry-points."fitbit_monitor.plugins"]
resting_trend = "fitbit_monitor.plugins.builtin.resting_trend:RestingTrendPlugin"

[project.scripts]
fm = "fitbit_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitbit_monitor = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fitbit_monitor"]
branch = true
omit = ["*/fitbit_monitor/plugins/testing.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.mypy]
python_version = "3.11"
files = ["src/fitbit_monitor"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
