name: CI

# One job per concern that the repository promises to keep green: this one runs the
# tests and fails under the coverage floor; `benchmark.yml` owns the perf gate.
# Both delegate to scripts/ci/*.sh so a laptop and the runner agree.
#
# Dependency installation goes through uv and uv.lock (`--locked` makes a stale
# lockfile a CI failure, so the pin committed in git cannot quietly rot). The
# pip-equivalent path - `pip install -e ".[dev]"` - stays supported for people who
# refuse a new tool; it is what scripts/ci/*.sh do without --no-install. ADR-0001 §2.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Type check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint (mypy, ruff, byte-compile)
        run: uv run --locked --extra dev --python "3.12" ./scripts/ci/lint.sh --no-install

  coverage:
    name: Tests and coverage (3.11, 3.12, 3.13, 3.14)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tests and coverage gate
        run: uv run --locked --extra dev --python "${{ matrix.python-version }}" ./scripts/ci/coverage.sh --no-install
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
