name: Benchmarks

# The perf gate. Compares the plugin system against the committed baseline
# (benchmarks/baseline.json) and fails on a regression past the tolerance, so an
# accidental O(n^2) in the read API or the runner cannot land quietly.
#
# Re-record the baseline deliberately:
#   ./scripts/ci/benchmarks.sh --update-baseline && git add benchmarks/baseline.json

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Plugin system vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Benchmark
        run: |
          ./scripts/ci/benchmarks.sh --no-install --json > benchmark-results.json
          cat benchmark-results.json
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f benchmark-results.json ]; then
            {
              echo "## Benchmark results"
              echo '```json'
              python -c "import json,sys; d=json.load(open('benchmark-results.json')); print(json.dumps({'cases': d['cases'], 'delta_percent': d.get('delta_percent'), 'regressions': d['regressions']}, indent=2))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
